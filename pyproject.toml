[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigit"
version = "0.1.0"
description = "A desktop file-selection app with GitHub device-flow authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "keyring>=25.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
minigit = "minigit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
